name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-pkg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .pkg installer
        run: |
          mkdir -p output
          mkdir -p build_payload/Library/Application\ Support/RMAddins/RMMailMergeTools
          cp manifest.xml "build_payload/Library/Application Support/RMAddins/RMMailMergeTools/manifest.xml"

          mkdir -p scripts
          cat > scripts/postinstall << 'EOF'
          #!/bin/bash
          MANIFEST_SRC="/Library/Application Support/RMAddins/RMMailMergeTools/manifest.xml"
          CURRENT_USER=$(stat -f%Su /dev/console)
          USER_HOME=$(eval echo "~${CURRENT_USER}")
          WEF_DIR="${USER_HOME}/Library/Containers/com.microsoft.Word/Data/Documents/wef"
          mkdir -p "${WEF_DIR}"
          cp "${MANIFEST_SRC}" "${WEF_DIR}/manifest.xml"
          chown "${CURRENT_USER}:staff" "${WEF_DIR}/manifest.xml"
          chmod 644 "${WEF_DIR}/manifest.xml"
          exit 0
          EOF
          chmod +x scripts/postinstall

          cat > scripts/preinstall << 'EOF'
          #!/bin/bash
          CURRENT_USER=$(stat -f%Su /dev/console)
          USER_HOME=$(eval echo "~${CURRENT_USER}")
          WEF_DIR="${USER_HOME}/Library/Containers/com.microsoft.Word/Data/Documents/wef"
          rm -f "${WEF_DIR}/manifest.xml"
          exit 0
          EOF
          chmod +x scripts/preinstall

          pkgbuild \
            --root build_payload \
            --scripts scripts \
            --identifier "co.rmdigital.rmmailmerge.installer" \
            --version "1.0.0" \
            --install-location "/" \
            "output/RMMailMergeTools-Setup.pkg"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMMailMergeTools-macOS-pkg
          path: output/*.pkg
